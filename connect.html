<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Rohan Bopardikar</title>
<meta name="description" content="Rohan Bopardikar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500&family=Sahitya:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #161b18;
    --text: #cdd3cc;
    --muted: #8a938b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Sahitya, serif;
    font-size: 17px;
    line-height: 1.7;
  }
  main {
    width: fit-content;
    max-width: 100%;
    margin: 0;
    padding: 12vh 1.5rem 4rem clamp(1.5rem, 8vw, 7rem);
  }
  header {
    display: grid;
    grid-template-columns: auto auto;
    justify-content: start;
    align-items: center;
    column-gap: 1.25rem;
    margin-bottom: 2rem;
  }
  img { grid-column: 1; grid-row: 1 / span 2; align-self: center; width: 76px; height: auto; }
  h1 { grid-column: 2; grid-row: 1; }
  .affiliation { grid-column: 2; grid-row: 2; }
  h1 { margin: 0; font-size: 2.8rem; font-weight: 400; line-height: 1.1; white-space: nowrap; }
  .affiliation { display: flex; justify-content: space-between; gap: 1rem; margin: .25rem 0 0; color: var(--muted); font-size: .92em; }
  p { margin: 0 0 1.25rem; width: 0; min-width: 100%; }
  p, .affiliation { font-family: Karla, sans-serif; }
  a {
    color: #e2e7e0;
    text-decoration: underline;
    text-decoration-color: #5d6a61;
    text-decoration-thickness: 1px;
    text-underline-offset: 4px;
    transition: color .15s, text-decoration-color .15s;
  }
  a:hover { color: #fff; text-decoration-color: var(--text); }
  .connect { margin-top: 1.5rem; font-family: Karla, sans-serif; }
  .connect a { color: var(--muted); text-decoration-color: #3f4a43; }
  .connect a:hover { color: var(--text); text-decoration-color: var(--text); }
  p { text-align: justify; text-align-last: justify; text-wrap: balance; }
  @media (max-width: 600px) {
    body { font-size: 16px; }
    main { padding: 8vh 1.5rem 3rem; }
    h1 { font-size: 2.1rem; }
    img { width: 56px; }
  }
  .back { margin-bottom: 2rem; font-family: Karla, sans-serif; }
  .back a { color: var(--muted); text-decoration-color: #3f4a43; }
  .back a:hover { color: var(--text); text-decoration-color: var(--text); }
  main { width: fit-content; max-width: 100%; }
  p { width: 430px; max-width: 100%; text-align: left; text-align-last: auto; text-wrap: pretty; }
  h2 { margin: 0 0 1.25rem; font-size: 2.2rem; font-weight: 400; line-height: 1.2; }
  .links { font-family: Karla, sans-serif; display: grid; grid-template-columns: 5rem auto; justify-content: start; column-gap: 1rem; row-gap: .25rem; }
  .links .k { color: var(--muted); }
  .copy {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: .4rem;
    color: var(--muted); font: inherit; line-height: inherit; transition: color .1s ease;
  }
  .copy:hover, .copy:focus-visible { color: var(--text); }
  .copy.done { color: #8fbf9b; }
  .copy svg { width: 1em; height: 1em; flex: none; }
  .links { align-items: center; }
  .links > * { line-height: 1.7; }
</style>
</head>
<body>
<main>
  <div class="back"><a href="index.html">← back</a></div>
  <h2>Contact</h2>
  <p>
    I'm happy to talk research, opportunities, and random interesting thoughts. The best way to reach me is by email.
  </p>
  <div class="links" style="margin-top:1.5rem">
    <span class="k" id="email-label">email</span><a id="email" href="#" data-e="dWRlLmFpYm11bG9jQGIubmFob3I=">show email</a><noscript>rohan.b [at] columbia [dot] edu</noscript>
    <span class="k">github</span><a href="https://github.com/rohanrrb" target="_blank" rel="noopener">rohanrrb</a>
    <span class="k">linkedin</span><a href="https://www.linkedin.com/in/rohanrrb/" target="_blank" rel="noopener">rohanrrb</a>
  </div>
</main>
<script>
  // The address is stored reversed and base64-encoded, and only decoded (as plain text) when clicked.
  var e = document.getElementById('email');
  var label = document.getElementById('email-label');
  var icon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H3A1.5 1.5 0 0 0 1.5 3v6A1.5 1.5 0 0 0 3 10.5h.5"/></svg>';
  e.addEventListener('click', function (ev) {
    ev.preventDefault();
    var addr = atob(e.dataset.e).split('').reverse().join('');
    var span = document.createElement('span');
    span.textContent = addr;
    e.replaceWith(span);
    var btn = document.createElement('button');
    btn.className = 'copy';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Copy email address');
    btn.innerHTML = icon + '<span>copy</span>';
    label.replaceChildren(btn);
    btn.addEventListener('click', function () {
      btn.classList.add('done');
      setTimeout(function () { btn.classList.remove('done'); }, 700);
      if (navigator.clipboard) navigator.clipboard.writeText(addr).catch(function () {});
    });
  });
</script>
</body>
</html>
